name: CI
on: 
    pull_request: 
        branches: [main]
jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Setup Node
              uses: actions/setup-node@v4
              with: 
                node_version: 24

            - name: Instal Dependencies
              run: npm ci

            - name: Build the Application
              run: npm run build

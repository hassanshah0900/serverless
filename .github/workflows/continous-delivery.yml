name: Production Deployment
on:
  push:
    branches: [main]
permissions:
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node_version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Build the Application
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::915093573141:role/serverless-prod-cicd-role
          aws-region: Asia Pacific (Mumbai)
      - name: Deploy Build Application to S3 Bucket
        run: |
          aws s3 sync dist/serverless/browser s3://serverless-bucket-915093573141-ap-south-1-an --delete
